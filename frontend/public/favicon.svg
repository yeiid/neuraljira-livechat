<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo redondeado estilo app icon -->
  <rect width="512" height="512" rx="110" fill="#0d0d14" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#neuralGrad)" stroke-width="4" opacity="0.4" />
  
  <!-- Conexiones neuronales de fondo -->
  <circle cx="160" cy="150" r="12" fill="#8b5cf6" opacity="0.6" />
  <circle cx="352" cy="150" r="12" fill="#06b6d4" opacity="0.6" />
  <circle cx="160" cy="362" r="12" fill="#06b6d4" opacity="0.6" />
  <circle cx="352" cy="362" r="12" fill="#8b5cf6" opacity="0.6" />
  <circle cx="256" cy="256" r="18" fill="url(#neuralGrad)" filter="url(#glow)" />
  
  <!-- Líneas de circuito/red -->
  <line x1="160" y1="150" x2="256" y2="256" stroke="#8b5cf6" stroke-width="5" stroke-dasharray="6 4" opacity="0.5" />
  <line x1="352" y1="150" x2="256" y2="256" stroke="#06b6d4" stroke-width="5" stroke-dasharray="6 4" opacity="0.5" />
  <line x1="160" y1="362" x2="256" y2="256" stroke="#06b6d4" stroke-width="5" stroke-dasharray="6 4" opacity="0.5" />
  <line x1="352" y1="362" x2="256" y2="256" stroke="#8b5cf6" stroke-width="5" stroke-dasharray="6 4" opacity="0.5" />
  
  <!-- Letra "N" Neuraljira dinámica -->
  <path d="M 170 360 L 170 152 L 230 152 L 302 284 L 302 152 L 342 152 L 342 360 L 282 360 L 210 228 L 210 360 Z" fill="url(#neuralGrad)" filter="url(#glow)" />
  
  <!-- Badge indicador LIVE -->
  <rect x="186" y="396" width="140" height="34" rx="17" fill="#f43f5e" />
  <circle cx="206" cy="413" r="5" fill="#ffffff" />
  <text x="220" y="420" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="2">LIVE</text>
</svg>
